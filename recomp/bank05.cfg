bank = 05

# $05:E5DB is the opcode byte reached only by the M=1 error path at
# $05:E556 (`JMP $E5D9`). The valid M=0 path at $E5D9 decodes
# `LDA #$0001` and continues at $E5DC; the M=1 path sees the third
# immediate byte as BRK. Marking just the BRK byte as non-code keeps
# the error path from poisoning the whole $05:D731 node while leaving
# the M=0 continuation intact.
data_region 05 e5db e5dc

# $05:96A0 returns M1X0.
exit_mx_variant 0596A0 1 0 1 0
