# Progressive symbol map for Kyuuyaku Megami Tensei.
#
# Each [[func]] names an address the analyzer should treat as a function.
# Set emit = true to promote one into ahead-of-time codegen; leave it false
# to keep it interpreted. tools/regen.sh syncs labels and tier choices into
# each recomp/bankNN.cfg; only emit=true adds a func/funcs.h declaration.
# Do not hand-edit the generated blocks in the bank configs.

[[func]]
name = "I_RESET"
addr = "8000"
bank = 0
emit = false
note = "Emulation RESET vector ($FFFC)"

[[func]]
name = "I_NMI"
addr = "827a"
bank = 0
emit = false
note = "Native NMI vector ($FFEA)"

# Level-up screen (bank $01). Entry $B3C6 sets up the screen and runs the
# BONUS allocation loop; $B5D5 prints one stat and applies the 35 cap.
# Both were exercised in the normal and debug-boosted level-up runs.
[[func]]
name = "LevelUp_Apply"
addr = "B3C6"
bank = 1
emit = true
entry_m = 1
entry_x = 1
note = "Level-up screen setup/allocation/finalize; called from bank $01 and $03"

[[func]]
name = "LevelUp_PrintStat"
addr = "B5D5"
bank = 1
emit = true
entry_m = 1
entry_x = 1
note = "Print/clamp one level-up stat; JSR target from LevelUp_Apply"

# SRAM save/load path (bank $03). These are the first game routines promoted
# from the interpreter so the save/load behavior can be compared AOT vs LLE.
[[func]]
name = "Sram_SaveSlot"
addr = "A35B"
bank = 3
emit = true
entry_m = 1
entry_x = 0
note = "Copy WRAM $7E:0C00/$7E:8000 to an SRAM slot; checksum at slot+$00EF"

[[func]]
name = "Sram_LoadSlot"
addr = "A3BF"
bank = 3
emit = true
entry_m = 1
entry_x = 0
note = "Copy an SRAM slot to WRAM $7E:0C00/$7E:8000"

[[func]]
name = "Sram_CheckHeader"
addr = "A397"
bank = 3
emit = true
entry_m = 1
entry_x = 0
note = "Check the DDSO header in SRAM"

[[func]]
name = "Sram_Checksum"
addr = "ACFB"
bank = 3
emit = true
entry_m = 1
entry_x = 0
note = "Checksum helper for one 0x800-byte SRAM slot"

[[func]]
name = "Sram_ValidateChecksums"
addr = "AD20"
bank = 3
emit = true
entry_m = 1
entry_x = 0
note = "Validate the four SRAM save slots"

