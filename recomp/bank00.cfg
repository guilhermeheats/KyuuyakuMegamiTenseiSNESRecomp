# Kyuuyaku Megami Tensei (JPN) — LLE-first seed
# Regenerate with tools/regen.sh. Promote functions by editing recomp/symbols.toml
# and re-running the regen script, which rewrites the block below.
bank = 0
auto_vectors
tier_down_stubs

# Reset vector $8000, native NMI $827a (from the cartridge header).

# >>> BEGIN symbols.toml (generated — do not edit)
symbol 008000 I_RESET
force_lle 008000
symbol 00827a I_NMI
force_lle 00827a
symbol 009397 FrameWait
# <<< END symbols.toml
# >>> coverage roots
# Auto-generated from the 2026-11-18 boot coverage capture (clean call landings).
# These are analysis roots; rename them as the functions are identified.
func Coverage_00_820E_V10 820e entry_mx:1,0
func Coverage_00_830A_V10 830a entry_mx:1,0
func Coverage_00_83A6_V10 83a6 entry_mx:1,0
func Coverage_00_845B_V10 845b entry_mx:1,0
func Coverage_00_84E8_V10 84e8 entry_mx:1,0
func Coverage_00_869B_V10 869b entry_mx:1,0
func Coverage_00_86C0_V10 86c0 entry_mx:1,0
func Coverage_00_88CE_V10 88ce entry_mx:1,0
func Coverage_00_8932_V10 8932 entry_mx:1,0
func Coverage_00_9397_V00 9397 entry_mx:0,0
func Coverage_00_9397_V10 9397 entry_mx:1,0
func Coverage_00_9397_V11 9397 entry_mx:1,1
func Coverage_00_93F2_V00 93f2 entry_mx:0,0
func Coverage_00_93F2_V10 93f2 entry_mx:1,0
