# $00:9397 is the frame-wait primitive. It pushes PHP at entry and
# restores it with PLP at $93F0; PLX restores the caller's X. The exit
# width therefore mirrors the entry width. The function itself stays LLE
# because its init path tail-enters $01:8EAB -> $00:8014 (the main loop),
# but declaring the return width lets callers (B0B6, LevelUp_Apply, ...)
# be proven and promoted to AOT.
exit_mx_variant 009397 0 0 0 0
exit_mx_variant 009397 0 1 0 1
exit_mx_variant 009397 1 0 1 0
exit_mx_variant 009397 1 1 1 1

# HDMA live-pointer dispatchers. Their final JMP ($0100) indexes a known
# ROM target table, but the AOT emitter cannot yet materialize the live
# dispatch without a link-closure failure. Keep the whole functions on the
# LLE interpreter until indirect_dispatch is fixed; the tables and target
# sets are documented in docs/coverage.md.
force_lle 0086C0
force_lle 0088CE

# $00:90EB / $00:F160 preserve M/X (RTL paths restore P/X).
exit_mx_variant 0090EB 1 0 1 0
exit_mx_variant 0090EB 1 1 1 1
exit_mx_variant 00F160 1 1 1 1

# $00:93B4 JSLs $01:8EAB, whose init path enters $00:8014 (main loop)
# and never returns. The frame-wait call site is terminal; its normal
# early-return path is before this call.
noreturn_jsl 93b4

# $00:9B04 JMP ($0000) dispatch through the 32-word table at $9B08,
# indexed by ($0875 & $1F) * 2. Targets recovered from the ROM table.
indirect_dispatch 9b04 32 ptrtail targets:9c59,9b97,9b55,a051,a04a,9efb,9f81,9ee4,a4ba,a507,a00c,9b48,9d6e,9b48,9b48,a1d8,9b48,9c1b,9b48,9b48,9b48,9b48,9b70,9b69,9b48,9b48,9b48,9b48,9b48,9c3a,9c59,9c59

# $00:9077 returns M1X0 (RTL at $90EA).
exit_mx_variant 009077 1 0 1 0

# $00:9188 / $00:947D preserve M1X0.
exit_mx_variant 009188 1 0 1 0
exit_mx_variant 00947D 1 0 1 0
